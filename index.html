<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>狩獵戰棋：六角格版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="select-none overflow-hidden">

<!-- 標題、主選單、設定、自由對戰設定、劇情各頁面都畫在這裡 -->
<div id="screen-view" class="screen"></div>

<!-- ================= 戰鬥 ================= -->
<div id="screen-game" class="screen hidden">
  <header class="shrink-0 px-2 pt-2 pb-1.5 flex items-center gap-1.5">
    <button data-act="pause" class="tap w-8 text-lg shrink-0" aria-label="暫停">⏸️</button>
    <div class="w-11 h-11 rounded-xl bg-white p-0.5 shrink-0 shadow-lg"><img id="hud-mon-img" class="w-full h-full object-contain" alt=""></div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between gap-1">
        <span id="hud-mon-name" class="font-black text-red-300 text-sm truncate">魔物</span>
        <span id="turn-display" class="shrink-0 text-[10px] font-bold text-gray-400 bg-black/40 px-2 py-0.5 rounded-full">第 1 回合</span>
      </div>
      <div class="bar bar-red mt-1 relative overflow-visible"><div id="monster-hp-bar" style="width:100%"></div><span id="cap-mark" class="cap-mark hidden"></span></div>
      <div class="flex justify-between text-[10px] mt-0.5 gap-1">
        <span id="monster-hp-text" class="text-gray-300 font-bold shrink-0">40/40</span>
        <span id="monster-intent-name" class="text-amber-400 font-bold truncate">正在鎖定...</span>
      </div>
    </div>
    <button data-act="drawer" data-name="help" class="tap w-8 text-lg shrink-0" aria-label="說明">❓</button>
    <button data-act="drawer" data-name="log" class="tap w-8 text-lg shrink-0" aria-label="日誌">📜</button>
  </header>
  <div id="monster-intent-desc" class="shrink-0 mx-2 mb-1 px-3 py-1 rounded-lg bg-red-950/50 border border-red-900/60 text-[11px] text-red-100 truncate"></div>
  <div id="objective-bar" class="hidden shrink-0 mx-2 mb-1 px-3 py-1 rounded-lg bg-amber-950/40 border border-amber-900/50 text-[11px] text-amber-100 flex items-center justify-between gap-2"></div>

  <main class="flex-1 min-h-0 flex items-center justify-center px-1.5 relative">
    <div id="grid-wrap" class="relative" style="aspect-ratio:1.18;width:100%;max-width:560px;max-height:100%;">
      <div id="grid-container" class="absolute inset-0 rounded-2xl border border-gray-800 bg-[#11151c] shadow-[inset_0_0_40px_rgba(0,0,0,.6)]"></div>
    </div>
  </main>

  <div id="placement-hint" class="hidden shrink-0 mx-2 mb-1 text-center text-[11px] font-bold text-amber-300 animate-pulse">👉 點擊相鄰的空格放置道具 <button data-act="cancel-place" class="underline text-gray-300 ml-2">取消</button></div>
  <div id="mini-log" data-act="drawer" data-name="log" class="shrink-0 mx-2 mb-1 px-3 py-1.5 rounded-lg bg-black/30 border border-gray-800 text-[11px] text-gray-400 leading-snug"></div>

  <footer class="shrink-0 bg-[#12161d] border-t border-gray-800 px-2 pt-2 pb-2 space-y-1.5 shadow-[0_-10px_24px_rgba(0,0,0,.45)]">
    <div class="flex gap-2 items-stretch">
      <div id="hunter-cards" class="flex-1 min-w-0 flex gap-2"></div>
      <button data-act="end-turn" id="btn-end" class="tap btn-danger px-3 text-xs leading-tight shrink-0">結束<br>回合</button>
    </div>
    <div class="flex items-center justify-between px-1 gap-2">
      <span class="text-[10px] text-gray-500 truncate">手牌 <span id="hand-count">0</span>/<span id="hand-max">3</span> ・ 牌庫 <span id="deck-count">0</span> ・ 棄牌 <span id="discard-count">0</span> ・ 消耗 <span id="removed-count">0</span></span>
      <div class="flex gap-1.5 shrink-0">
        <button data-act="gather" id="btn-gather" class="hidden text-[11px] font-bold px-2 py-1 rounded-lg bg-lime-800 text-lime-100">🌿 採集</button>
        <button data-act="undo" id="btn-undo" class="hidden text-[11px] font-bold px-2 py-1 rounded-lg bg-gray-700 text-gray-100">↶ 撤回</button>
      </div>
    </div>
    <div id="hand-container" class="flex gap-2 justify-center pb-1" style="min-height:118px"></div>
  </footer>
</div>

<!-- 抽屜：說明 -->
<div id="backdrop-help" class="backdrop" data-act="drawer" data-name="help"></div>
<div id="drawer-help" class="drawer p-4 flex flex-col" style="max-height:82dvh">
  <div class="flex justify-between items-center mb-2"><b class="text-sm">❓ 怎麼玩</b><button data-act="drawer" data-name="help" class="tap px-3 text-gray-400">✕</button></div>
  <div id="help-body" class="overflow-y-auto text-xs text-gray-200 space-y-3 leading-relaxed"></div>
</div>
<!-- 抽屜：日誌 -->
<div id="backdrop-log" class="backdrop" data-act="drawer" data-name="log"></div>
<div id="drawer-log" class="drawer p-3 flex flex-col" style="height:55dvh">
  <div class="flex justify-between items-center mb-2"><b class="text-sm">📜 戰鬥日誌</b><button data-act="drawer" data-name="log" class="tap px-3 text-gray-400">✕</button></div>
  <div id="battle-log" class="flex-1 bg-black/40 rounded-xl p-2 overflow-y-auto text-xs space-y-1.5 log-box"></div>
</div>

<!-- 防禦選擇 -->
<div id="defense-modal" class="modal hidden" style="z-index:92">
  <div class="panel w-full max-w-sm p-5 text-center border-red-500/60">
    <div class="text-3xl mb-1">⚠️</div>
    <h2 class="text-lg font-black text-red-400 mb-1">危機來襲！</h2>
    <p class="text-sm text-gray-300 mb-4"><b id="def-target">某人</b> 即將受到 <b id="def-dmg" class="text-red-400 text-xl">X</b> 點傷害<br><span class="text-[11px] text-gray-500">來源：<span id="def-source"></span></span></p>
    <div class="flex flex-col gap-2">
      <button id="btn-use-dodge" class="tap hidden rounded-xl py-3 font-bold bg-blue-600 text-white">💨 翻滾迴避 ・ 完全閃躲</button>
      <button id="btn-use-shield" class="tap hidden rounded-xl py-3 font-bold bg-green-700 text-white">🛡️ 舉盾掩護</button>
      <button id="btn-take-dmg" class="tap rounded-xl py-3 font-bold bg-red-950 border border-red-800 text-red-200">🩸 硬扛</button>
    </div>
  </div>
</div>

<!-- 通用對話框（確認、暫停、結算、魔物資料） -->
<div id="modal" class="modal hidden" style="z-index:90"><div id="modal-box" class="panel w-full max-w-sm p-5 max-h-[88dvh] overflow-y-auto"></div></div>

<div id="banner"><div class="b-main"></div><div class="b-sub"></div></div>
<div id="announce"></div>
<div id="tut-ring" class="hidden"></div>
<div id="tut-box" class="hidden"></div>
<div id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
