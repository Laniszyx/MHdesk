<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>狩獵戰棋：六角格版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tapestry.css">
</head>
<body class="select-none overflow-hidden">
<div id="frame" aria-hidden="true"></div>

<!-- 標題、主選單、設定、自由對戰設定、劇情各頁面都畫在這裡 -->
<div id="screen-view" class="screen"></div>

<!-- ================= 戰鬥 ================= -->
<div id="screen-game" class="screen hidden">
  <div class="hud">
    <div class="hud-bar">
      <button data-act="pause" class="btn btn-icon" aria-label="暫停"><svg class="ic"><use href="#i-pause"/></svg></button>
      <div class="hud-meta"><span id="turn-display" class="pill">第 1 回合</span><span id="cart-display" class="pill hidden"></span></div>
      <button data-act="drawer" data-name="help" class="btn btn-icon" aria-label="說明"><svg class="ic"><use href="#i-help"/></svg></button>
      <button data-act="drawer" data-name="log" class="btn btn-icon" aria-label="日誌"><svg class="ic"><use href="#i-log"/></svg></button>
    </div>
    <div class="hud-mon">
      <div class="flex-1 min-w-0">
        <div class="hud-name"><span id="hud-mon-name">魔物</span><span id="hud-mon-tags"></span></div>
        <div class="bar bar-red hud-hp"><div id="monster-hp-bar" style="width:100%"></div><span id="cap-mark" class="cap-mark hidden"></span></div>
        <div class="hud-hpline"><span id="monster-hp-text">40 / 40</span><span id="hud-objective" class="obj"></span></div>
      </div>
      <div class="tile mon-tile"><img id="hud-mon-img" alt=""></div>
    </div>
    <button id="monster-intent-desc" class="intent" data-act="intent-info"></button>
    <span id="monster-intent-name" class="hidden"></span>
  </div>

  <main class="flex-1 min-h-0 flex items-center justify-center px-1 relative">
    <div id="grid-wrap" class="relative" style="aspect-ratio:1.18;width:100%;max-width:560px;max-height:100%;">
      <div id="grid-container" class="absolute inset-0"></div>
    </div>
    <div id="placement-hint" class="hidden"><svg class="ic animate-pulse"><use href="#i-pin"/></svg>點相鄰的發亮格放置 <button data-act="cancel-place" class="btn btn-link">取消</button></div>
    <div id="mini-log" data-act="drawer" data-name="log"></div>
  </main>

  <footer class="dock">
    <div class="dock-row">
      <div id="hunter-cards" class="flex-1 min-w-0 flex gap-2"></div>
      <button data-act="gather" id="btn-gather" class="hidden btn btn-secondary btn-side"><svg class="ic"><use href="#i-herb"/></svg>採集</button>
      <button data-act="undo" id="btn-undo" class="hidden btn btn-secondary btn-side" aria-label="撤回移動"><svg class="ic"><use href="#i-undo"/></svg>撤回</button>
      <button data-act="end-turn" id="btn-end" class="btn btn-danger btn-end"><svg class="ic"><use href="#i-hourglass"/></svg>結束回合</button>
    </div>
    <span class="hidden">牌庫 <b id="deck-count">0</b> 棄牌 <b id="discard-count">0</b> 手牌 <span id="hand-count">0</span>/<span id="hand-max">3</span> 消耗 <span id="removed-count">0</span></span>
    <div id="hand-container" class="hand"></div>
  </footer>
</div>

<!-- 抽屜：說明 -->
<div id="backdrop-help" class="backdrop" data-act="drawer" data-name="help"></div>
<div id="drawer-help" class="drawer p-4 flex flex-col" style="max-height:82dvh">
  <div class="flex justify-between items-center mb-2"><b class="text-sm flex items-center gap-2"><svg class="ic text-amber-400"><use href="#i-help"/></svg>怎麼玩</b><button data-act="drawer" data-name="help" class="btn btn-icon" aria-label="關閉"><svg class="ic"><use href="#i-close"/></svg></button></div>
  <div id="help-body" class="overflow-y-auto text-xs text-gray-200 space-y-3 leading-relaxed"></div>
</div>
<!-- 抽屜：日誌 -->
<div id="backdrop-log" class="backdrop" data-act="drawer" data-name="log"></div>
<div id="drawer-log" class="drawer p-3 flex flex-col" style="height:55dvh">
  <div class="flex justify-between items-center mb-2"><b class="text-sm flex items-center gap-2"><svg class="ic text-amber-400"><use href="#i-log"/></svg>戰鬥日誌<span id="log-counts" class="text-[11px] font-bold text-gray-500 ml-2"></span></b><button data-act="drawer" data-name="log" class="btn btn-icon" aria-label="關閉"><svg class="ic"><use href="#i-close"/></svg></button></div>
  <div id="battle-log" class="flex-1 bg-black/40 rounded-xl p-2 overflow-y-auto text-xs space-y-1.5 log-box"></div>
</div>

<!-- 防禦選擇 -->
<div id="defense-modal" class="modal hidden" style="z-index:92">
  <div class="panel w-full max-w-sm p-5 text-center border-red-500/60">
    <div class="hero-ic mb-2"><svg class="ic mh"><use href="#m-hazard"/></svg></div>
    <h2 class="text-lg font-black text-red-400 mb-1">危機來襲！</h2>
    <p class="text-sm text-gray-300 mb-4"><b id="def-target">某人</b> 即將受到 <b id="def-dmg" class="text-red-400 text-xl">X</b> 點傷害<br><span class="text-[11px] text-gray-500">來源：<span id="def-source"></span></span></p>
    <div class="flex flex-col gap-2">
      <button id="btn-use-dodge" class="hidden btn btn-lg btn-block btn-secondary"><svg class="ic text-sky-300"><use href="#i-dodge"/></svg>翻滾迴避・完全閃躲</button>
      <button id="btn-use-shield" class="hidden btn btn-lg btn-block btn-secondary"></button>
      <button id="btn-take-dmg" class="btn btn-lg btn-block btn-danger-soft"><svg class="ic"><use href="#i-heartbreak"/></svg>硬扛</button>
    </div>
  </div>
</div>

<!-- 通用對話框（確認、暫停、結算、魔物資料） -->
<div id="modal" class="modal hidden" style="z-index:90"><div id="modal-box" class="panel w-full max-w-sm p-5 max-h-[88dvh] overflow-y-auto"></div></div>

<div id="banner"><div class="b-main"></div><div class="b-sub"></div></div>
<div id="announce"></div>
<div id="tut-ring" class="hidden"></div>
<div id="tut-box" class="hidden"></div>
<div id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
